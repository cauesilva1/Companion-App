name: Companion
options:
  bundleIdPrefix: com.companion
  deploymentTarget:
    iOS: "16.2"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  SWIFT_VERSION: "5.9"
  TARGETED_DEVICE_FAMILY: "1"
  IPHONEOS_DEPLOYMENT_TARGET: "16.2"
  DEVELOPMENT_TEAM: "H4UF292924"
  CODE_SIGN_STYLE: Automatic

targets:
  Companion:
    type: application
    platform: iOS
    sources:
      - path: Companion
      - path: Shared
        excludes:
          - "DinoSheets/**"
          - "SFX/**"
    resources:
      - path: Shared/SFX
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.companion.tamagotchi
        PRODUCT_NAME: Companion
        INFOPLIST_FILE: Companion/Info.plist
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_KEY_CFBundleDisplayName: Companion
        CODE_SIGN_ENTITLEMENTS: Companion/Companion.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 3
        MARKETING_VERSION: 1.0.1
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIRequiresFullScreen: YES
    dependencies:
      - target: CompanionWidget
        embed: true
    scheme:
      testTargets:
        - CompanionTests

  CompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CompanionTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.companion.tamagotchi.tests
        PRODUCT_NAME: CompanionTests
        GENERATE_INFOPLIST_FILE: true
        CURRENT_PROJECT_VERSION: 3
        MARKETING_VERSION: 1.0.1
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: Companion

  CompanionWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: CompanionWidget
      - path: Shared
        excludes:
          - "DinoSheets/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.companion.tamagotchi.widget
        PRODUCT_NAME: CompanionWidget
        INFOPLIST_FILE: CompanionWidget/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: CompanionWidget/CompanionWidget.entitlements
        SKIP_INSTALL: YES
        CURRENT_PROJECT_VERSION: 3
        MARKETING_VERSION: 1.0.1
    dependencies: []
    scheme: {}
